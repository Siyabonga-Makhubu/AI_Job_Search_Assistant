name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      PORT: 3000
      API_BASE_URL: http://localhost:3000
      BASE_URL: http://localhost:4173
      RESPONSE_TIME_THRESHOLD_MS: 3000
      # Real secrets are injected from GitHub repository secrets.
      # Tests that require a live DB or LLM are skipped when these are absent.
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Never run live DeepEval in standard CI — would consume API quota
      RUN_LIVE_EVAL: "false"

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Backend dependencies ──────────────────────────────────────────────
      - name: Install backend dependencies
        run: npm ci

      # ── Frontend dependencies ─────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ── Playwright browsers ───────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Start backend ─────────────────────────────────────────────────────
      # Build first so we can run the compiled server (avoids ts-node-dev in CI)
      - name: Build backend
        run: npm run build

      - name: Start backend server
        run: node dist/server.js &
        env:
          PORT: 3000
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/v1/health; then
              echo "Backend ready"
              exit 0
            fi
            echo "Waiting... attempt $i"
            sleep 2
          done
          echo "Backend failed to start" && exit 1

      # ── Run smoke tests (fast, required to pass) ──────────────────────────
      - name: Run smoke tests
        run: npx playwright test --grep "@smoke" --project=api --project=chromium

      # ── Run API tests ─────────────────────────────────────────────────────
      - name: Run API tests
        run: npm run test:api

      # ── Run E2E tests ─────────────────────────────────────────────────────
      - name: Run E2E tests
        run: npm run test:e2e

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7
